[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "api-contract-diff"
version = "0.2.0"
description = "A conservative OpenAPI 3.0 compatibility checker for CI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
contract-diff = "contract_diff.cli:main"

[project.optional-dependencies]
yaml = ["PyYAML>=6.0.3,<7"]
dev = ["ruff==0.17.1", "build==1.6.1", "PyYAML==6.0.3", "jsonschema==4.26.0", "hypothesis==6.170.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
